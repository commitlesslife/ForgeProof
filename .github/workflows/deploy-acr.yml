name: Build and Push Backend to Azure ACR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: forgeproofsunil.azurecr.io
          username: forgeproofsunil
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          cd backend
          docker build -t forgeproofsunil.azurecr.io/forgeproof-backend:latest .
          docker push forgeproofsunil.azurecr.io/forgeproof-backend:latest
